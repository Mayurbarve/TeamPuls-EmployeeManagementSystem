spring.application.name=teampulse-java
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/teampulse;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.jackson.serialization.write-dates-as-timestamps=false
teampulse.jwt.secret=${JWT_SECRET:local-development-secret-key-change-this-before-deploying-2026}
teampulse.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
teampulse.cors.origins=${CORS_ORIGINS:http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173}
teampulse.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
teampulse.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
teampulse.agent.api-key=${AGENT_API_KEY:}
