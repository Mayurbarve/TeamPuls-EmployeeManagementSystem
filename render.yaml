services:
  - type: pserv
    name: teampulse-mysql
    runtime: docker
    repo: https://github.com/render-examples/mysql.git
    branch: master
    plan: starter
    envVars:
      - key: MYSQL_DATABASE
        value: teampulse
      - key: MYSQL_USER
        value: teampulse
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: teampulse-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  - type: web
    name: teampulse-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: DB_HOSTPORT
        fromService:
          type: pserv
          name: teampulse-mysql
          property: hostport
      - key: DB_USERNAME
        value: teampulse
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: teampulse-mysql
          envVarKey: MYSQL_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_API_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: teampulse-dashboard
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: teampulse-dashboard
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: teampulse-api
          envVarKey: RENDER_EXTERNAL_URL
