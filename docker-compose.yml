services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teampulse}
      MYSQL_USER: ${MYSQL_USER:-teampulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-teampulse_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - teampulse_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  teampulse_mysql:
